[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dowbench"
version = "0.0.1"
description = "Reproducible benchmark of denial-of-wallet attacks and defenses for LLM agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["llm", "agents", "security", "denial-of-wallet", "benchmark", "red-teaming", "cost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/samuelrojas-dev/agent-cost-bench"
Issues = "https://github.com/samuelrojas-dev/agent-cost-bench/issues"

[project.optional-dependencies]
gemini = ["google-genai>=2.25,<3"]
anthropic = ["anthropic>=1.8,<2"]
dev = [
    "dowbench[gemini,anthropic]",
    "hypothesis>=6",
    "pre-commit>=3",
    "pytest-cov>=5",
    "pytest>=8",
    "ruff>=0.16,<0.17",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
dowbench = "dowbench.cli:app"

# Built-in components are registered as plugins too (ADR 0021): a third party adds a
# provider, defense or attack pack from its own package by declaring the same entry points.
[project.entry-points."dowbench.providers"]
mock = "dowbench.providers.mock:build_mock"
gemini = "dowbench.providers.gemini:build_gemini"
anthropic = "dowbench.providers.claude:build_anthropic"

[project.entry-points."dowbench.defenses"]
token_budget = "dowbench.defenses.limits:TokenBudget"
turn_limit = "dowbench.defenses.limits:TurnLimit"
loop_detect = "dowbench.defenses.limits:LoopDetect"
result_cap = "dowbench.defenses.limits:ResultCap"

[project.entry-points."dowbench.codecs"]
gemini = "dowbench.providers.provider_data:GeminiCodec"

[project.entry-points."dowbench.sut_mappers"]
mock = "dowbench.sut:map_mock_response"
gemini = "dowbench.providers.gemini:map_sut_response"
anthropic = "dowbench.providers.claude:map_sut_response"

# Tool-definition loaders for `dowbench scan` (ADR 0022): a loader turns a framework's tool
# export into the neutral ToolSpec list. A third party adds `from_langchain`, CrewAI, etc. by
# declaring the same entry point from its own package.
[project.entry-points."dowbench.tool_loaders"]
openai = "dowbench.scan.loaders:from_openai_tools"
langchain = "dowbench.scan.loaders:from_langchain"
openapi = "dowbench.scan.loaders:from_openapi"

[tool.hatch.build.targets.wheel]
packages = ["src/dowbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
