# USD per million tokens. Every real entry needs the official pricing URL and the date it was read.
# Entries with `simulated: true` exist only for the mock provider; their results are never published.
# Real entries use paid list prices even when a run uses a free tier (ADR 0004).
prices:
  - provider: mock
    model: mock-1
    input_per_mtok: 1.0
    output_per_mtok: 5.0
    cache_read_per_mtok: 0.1
    cache_write_per_mtok: 1.25
    source: simulated
    retrieved: 2026-09-25
    simulated: true

  # Anthropic: cache_write is the 5-minute write rate; 1-hour writes are rejected by the adapter.
  - provider: anthropic
    model: claude-haiku-4-5
    input_per_mtok: 1.0
    output_per_mtok: 5.0
    cache_read_per_mtok: 0.10
    cache_write_per_mtok: 1.25
    source: https://platform.claude.com/docs/en/about-claude/pricing
    retrieved: 2026-09-25
  - provider: anthropic
    model: claude-sonnet-5
    input_per_mtok: 2.0
    output_per_mtok: 10.0
    cache_read_per_mtok: 0.20
    cache_write_per_mtok: 2.50
    source: https://platform.claude.com/docs/en/about-claude/pricing
    retrieved: 2026-09-25

  # Gemini: text input; output price includes thinking tokens. The adapter never reports
  # cache writes (implicit caching has no write charge), so cache_write repeats the input rate.
  - provider: gemini
    model: gemini-2.5-flash-lite
    input_per_mtok: 0.10
    output_per_mtok: 0.40
    cache_read_per_mtok: 0.01
    cache_write_per_mtok: 0.10
    source: https://ai.google.dev/gemini-api/docs/pricing
    retrieved: 2026-09-25
  - provider: gemini
    model: gemini-2.5-flash
    input_per_mtok: 0.30
    output_per_mtok: 2.50
    cache_read_per_mtok: 0.03
    cache_write_per_mtok: 0.30
    source: https://ai.google.dev/gemini-api/docs/pricing
    retrieved: 2026-09-25
