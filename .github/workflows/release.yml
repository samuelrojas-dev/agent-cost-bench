name: release

# Builds the sdist + wheel and publishes to PyPI via Trusted Publishing (OIDC) — no stored token.
# - push a tag `vX.Y.Z`      → build, verify, publish to PyPI (environment: pypi)
# - run manually (dispatch)  → build, verify, publish to TestPyPI (environment: testpypi) — the dry run
# The trusted publishers on PyPI and TestPyPI are configured once (see docs/RELEASING.md).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Default: read-only. The publish jobs request id-token at the job level.
permissions:
  contents: read

jobs:
  build:
    name: build + check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Tag matches package version (tag pushes only)
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/dowbench/__init__.py").read_text()).group(1))')"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package version $pkg"
            exit 1
          fi
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: publish to TestPyPI (dry run)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
