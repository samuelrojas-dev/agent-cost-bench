[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dowbench"
version = "0.0.1"
description = "Reproducible benchmark of denial-of-wallet attacks and defenses for LLM agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
gemini = ["google-genai>=2.25,<3"]
anthropic = ["anthropic>=1.8,<2"]
dev = [
    "dowbench[gemini,anthropic]",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
dowbench = "dowbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dowbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
