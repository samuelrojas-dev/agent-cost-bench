# Bring your own agent (ADR 0012): benchmark examples/mock_agent.py, offline and free.
# Copy this file, point `agent` at your own class, set `provider` and your agent's model.
run_name: agent-mock
provider: mock
models: [mock-1]
agent: "examples.mock_agent:MockAgent"
attacks: all
repeats: 1
seed: 0
success_threshold: 5.0
ceiling:
  max_turns: 12
  max_tokens_per_call: 1024
  max_total_tokens: 50000
defenses:
  - name: none
