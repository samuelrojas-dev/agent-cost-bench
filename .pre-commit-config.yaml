repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src tests
        # An isolated env with mypy and the project's typing dependencies, so the
        # pydantic.mypy plugin (tool.mypy) and third-party imports resolve without needing
        # the contributor's venv on PATH.
        language: python
        additional_dependencies:
          - mypy>=1.11
          - pydantic>=2.7,<3
          - pyyaml>=6.0
          - typer>=0.12
          - types-PyYAML
          - google-genai>=2.25,<3
          - anthropic>=1.8,<2
          - pytest>=8
          - hypothesis>=6
        types: [python]
        pass_filenames: false
