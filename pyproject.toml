[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dowbench"
version = "0.0.1"
description = "Reproducible benchmark of denial-of-wallet attacks and defenses for LLM agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["llm", "agents", "security", "denial-of-wallet", "benchmark", "red-teaming", "cost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/samuelrojas-dev/agent-cost-bench"
Issues = "https://github.com/samuelrojas-dev/agent-cost-bench/issues"

[project.optional-dependencies]
gemini = ["google-genai>=2.25,<3"]
anthropic = ["anthropic>=1.8,<2"]
dev = [
    "dowbench[gemini,anthropic]",
    "hypothesis>=6",
    "pytest>=8",
    "ruff>=0.16,<0.17",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
dowbench = "dowbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dowbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
