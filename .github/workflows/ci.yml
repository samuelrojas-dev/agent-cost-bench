name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token; the workflow uses no provider secrets and makes no provider calls (tests
# use mocks). gitleaks only reads the history.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type-check
        run: mypy src tests examples scripts
      - name: Test (no network, mock providers only)
        run: python -m pytest --cov=dowbench --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  replay-verify:
    name: replay-verify (published cassettes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Offline: replays the committed cassettes and checks each summary.json reproduces
    # byte for byte and matches the hash the README publishes. No key, no network, no spend
    # — but the provider SDKs are installed, since rebuilding a recorded response from the
    # cassette needs the provider's own types (e.g. google-genai for a Gemini run; ADR 0015).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[gemini,anthropic]"
      - name: Verify published cassettes replay to their committed, README-published hashes
        run: python scripts/verify_cassettes.py

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the PR's commits to scope the scan; without pull-requests: read
    # that call returns 403 "Resource not accessible by integration" under the read-only token.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
