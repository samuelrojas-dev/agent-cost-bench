name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token; the workflow uses no secrets and makes no provider calls (tests use mocks).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests
      - run: python -m pytest
