# OpenAI smoke test: the smallest authorized real run that proves the adapter works end to end
# against the live API — auth, request mapping, usage mapping, pricing and cassette recording.
# TWO episodes (the attack `bloat-verify-001` and its paired benign baseline, so amplification is
# measurable), ONE model call each: the `none` defense, capped at one turn.
# OpenAI has no server-side token count, so the ceiling is enforced AFTER the call (ADR 0023).
# Priced from the table (openai/gpt-6-luna); always run with --budget-usd as a hard cap.
run_name: smoke-openai-gpt-6-luna
provider: openai
models: [gpt-6-luna]
attacks:
  - bloat-verify-001
repeats: 1
seed: 0
success_threshold: 5.0
# One turn -> one model call per episode. Tight token ceiling keeps the worst case ~4,000 tokens.
ceiling:
  max_turns: 1
  max_tokens_per_call: 512
  max_total_tokens: 1000
defenses:
  - name: none
