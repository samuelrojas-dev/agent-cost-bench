# USD per million tokens. Every real entry needs the official pricing URL and the date it was read.
# `max_prompt_tokens`: upper edge of the tier these rates apply to (the context window if flat);
# required for real entries (ADR 0005).
# Entries with `simulated: true` exist only for the mock provider; their results are never published.
prices:
  - provider: mock
    model: mock-1
    input_per_mtok: 1.0
    output_per_mtok: 5.0
    cache_read_per_mtok: 0.1
    cache_write_per_mtok: 1.25
    source: simulated
    retrieved: 2026-09-25
    simulated: true

  # Claude 4.6 and later: "the full 1M token context window at standard pricing" (same page).
  # cache_write is the 5-minute rate; 1-hour writes are rejected by the adapter (ADR 0006).
  - provider: anthropic
    model: claude-sonnet-5
    input_per_mtok: 2.0
    output_per_mtok: 10.0
    cache_read_per_mtok: 0.20
    cache_write_per_mtok: 2.50
    max_prompt_tokens: 1000000
    source: https://platform.claude.com/docs/en/about-claude/pricing
    retrieved: 2026-09-26
  - provider: anthropic
    model: claude-opus-5
    input_per_mtok: 5.0
    output_per_mtok: 25.0
    cache_read_per_mtok: 0.50
    cache_write_per_mtok: 6.25
    max_prompt_tokens: 1000000
    source: https://platform.claude.com/docs/en/about-claude/pricing
    retrieved: 2026-09-26

  # Standard tab, paid tier, as copied from the page by the repo owner on 2026-09-25 (the page
  # is not reachable from the build environment). Output includes thinking tokens.
  # cache_write: the page lists no per-token price for implicit caching; recorded as 0 for
  # that reason, not as a measured price. max_prompt_tokens: single tier on the page, so the
  # context window, input_token_limit 1048576 from models.get on 2026-09-26.
  - provider: gemini
    model: gemini-3.5-flash-lite
    input_per_mtok: 0.30
    output_per_mtok: 2.50
    cache_read_per_mtok: 0.03
    cache_write_per_mtok: 0.0
    max_prompt_tokens: 1048576
    source: https://ai.google.dev/gemini-api/docs/pricing
    retrieved: 2026-09-25
